name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: website_dot_org:test

      - name: Smoke test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/example:/site" website_dot_org:test build . build
          out=example/build
          test -f $out/index.html
          test -f $out/notes.html
          test -f $out/sub/index.html
          test -f $out/sub/page.html
          test -f $out/typography.css
          grep -q "\"$(cat $out/version.txt)\"" $out/index.html
          grep -q 'href="https://github.com/plumbus-tech/website_dot_org"' $out/index.html
          grep -q 'guest@example.org:~/sub' $out/sub/page.html
          grep -q katex $out/notes.html
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/example-cards:/site" website_dot_org:test build . build
          out=example-cards/build
          test -f $out/intro/index.html
          test ! -e $out/soon/index.html
          test ! -e $out/head.html
          grep -q '<a class="wdo-card" href="intro/index.html"><div class="wdo-card-img"><img src="cover.svg"' $out/index.html
          grep -q 'wdo-draft' $out/index.html
          grep -q 'href="../logo.svg"' $out/intro/index.html
          grep -q '<figcaption>The unit circle.</figcaption>' $out/intro/index.html
          test "$(grep -o 'class="wdo-card[ "]' $out/index.html | head -1)" = 'class="wdo-card"'

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
