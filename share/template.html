<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$pagetitle$</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:wght@400;700&amp;family=Noto+Serif:wght@400;700&amp;display=swap" />
  <style>
    #content { max-width: $content-width$; margin: auto; }
    .title { text-align: center; margin-bottom: .2em; }
    pre { border: 1px solid #e6e6e6; border-radius: 3px; background-color: #f2f2f2;
          padding: 8pt; overflow: auto; margin: 1.2em; }
  </style>
$if(highlighting-css)$
  <style>
$highlighting-css$
  </style>
$endif$
  <link rel="stylesheet" href="$root$typography.css?v=$build-id$" />
  <script>
    // GitHub Pages lets browsers cache pages for 10 minutes. If a newer build
    // is deployed, refetch this page past the cache and reload once.
    (function () {
      var build = "$build-id$", key = "website-build-reload";
      fetch("$root$version.txt", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : build; })
        .then(function (latest) {
          latest = latest.trim();
          if (latest === build || sessionStorage.getItem(key) === latest) return;
          sessionStorage.setItem(key, latest);
          return fetch(location.href, { cache: "reload" }).then(function () { location.reload(); });
        })
        .catch(function () {});
    })();
  </script>
$for(header-includes)$
  $header-includes$
$endfor$
$if(math)$
  $math$
$endif$
</head>
<body>
<div id="content">
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$for(include-before)$
$include-before$
$endfor$
$body$
</div>
</body>
</html>
